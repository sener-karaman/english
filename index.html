<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f4e79">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="İngilizce">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>İngilizce A1→C2</title>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--ink:#1b1f24;--mute:#68707a;--line:#e3e6ea;
  --pri:#1f5fa8;--pri-soft:#e6effa;--ok:#1d8a4e;--ok-soft:#e3f4ea;--bad:#c0392b;--bad-soft:#fbe7e4;
  --chip:#eef1f4;--shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
  --A1:#2e9e6b;--A2:#3aa1a8;--B1:#2f73c4;--B2:#5b4fc4;--C1:#b5568f;--C2:#c4632f;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111418;--card:#1a1e24;--ink:#e8eaed;--mute:#9aa3ad;--line:#2a3038;
  --pri:#6aa6ec;--pri-soft:#1c2a3b;--ok:#4cc488;--ok-soft:#163024;--bad:#ef7b6d;--bad-soft:#3a1d1a;
  --chip:#232931;--shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
.wrap{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 86px)}
header h1{font-size:20px;margin:4px 2px 2px;letter-spacing:-.2px}
header .sub{color:var(--mute);font-size:13px;margin:0 2px 12px}
.levels{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.levels::-webkit-scrollbar{display:none}
.lv{flex:0 0 auto;min-width:74px;padding:8px 10px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);border:2px solid transparent;text-align:left}
.lv b{display:block;font-size:17px}
.lv small{color:var(--mute);font-size:11.5px}
.lv.on{border-color:var(--c)}
.lv .bar{height:4px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.lv .bar i{display:block;height:100%;background:var(--c)}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin:10px 0}
.muted{color:var(--mute)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--mute)}
.btn{padding:11px 14px;border-radius:12px;background:var(--pri);color:#fff;font-weight:600}
.btn.ghost{background:var(--pri-soft);color:var(--pri)}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:8px}
.btns .btn{flex:1}
.seg{display:flex;background:var(--chip);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 4px;border-radius:9px;font-size:13.5px;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.search{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.search:focus{border-color:var(--pri)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs .in{display:flex;width:100%;max-width:640px}
.tabs button{flex:1;padding:9px 0 8px;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--pri);font-weight:600}
.word{border-bottom:1px solid var(--line);padding:11px 2px}
.word:last-child{border-bottom:0}
.word .w{font-weight:650;font-size:16.5px}
.word .t{color:var(--mute);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.word.open .t{white-space:normal}
.word .det{display:none;margin-top:8px}
.word.open .det{display:block}
.ex1{font-size:14px;margin-top:3px;color:var(--ink);opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-style:italic}
.word.open .ex1{white-space:normal}
mark{background:var(--pri-soft);color:var(--pri);font-weight:700;font-style:normal;border-radius:4px;padding:0 2px}
.sent{background:var(--chip);border-radius:12px;padding:10px 12px;margin-top:8px;text-align:left}
.sent .en{font-size:16px}
.syn{border-top:1px solid var(--line);padding:9px 0}
.syn:first-child{border-top:0}
.syn .sw{font-weight:700;color:var(--pri)}
.syn .note{font-size:13px;color:var(--mute);margin:1px 0 4px}
.syn .se{font-size:15px}
.vrow{display:grid;grid-template-columns:1fr 1fr 1fr 36px;gap:6px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vrow .c{min-width:0;word-break:break-word}
.vrow .c b{font-size:15.5px}
.vrow .c small{display:block;font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.3px}
.vrow .tr{grid-column:1/4;font-size:13px;color:var(--mute);margin-top:-2px}
.irr{color:var(--C2)}
.badge{font-size:10.5px;padding:1px 7px;border-radius:99px;background:var(--bad-soft);color:var(--bad);margin-left:4px;vertical-align:2px}
.vforms{display:flex;gap:6px;margin:8px 0 2px}
.vforms div{flex:1;background:var(--chip);border-radius:10px;padding:6px 8px;text-align:center}
.vforms small{display:block;font-size:10.5px;color:var(--mute)}
.known-dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:0 0 9px}
.known-dot.k{background:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{padding:5px 10px;border-radius:99px;background:var(--pri-soft);color:var(--pri);font-size:14px}
.chip.plain{background:var(--chip);color:var(--ink)}
.spk{width:36px;height:36px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;flex:0 0 36px}
.spk svg{width:18px;height:18px}
.no-tts .spk{display:none}
.lab{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.4px;margin-top:8px}
.fc{min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;user-select:none}
.fc .big{font-size:34px;font-weight:700;letter-spacing:-.4px;word-break:break-word}
.fc .tr{font-size:20px;margin-top:8px}
.prog{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:var(--pri);transition:width .25s}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:12px;background:var(--chip);margin:8px 0;font-size:16px}
.opt.right{background:var(--ok-soft);color:var(--ok);font-weight:600}
.opt.wrong{background:var(--bad-soft);color:var(--bad)}
.q{font-size:19px;font-weight:650;margin:6px 0 4px}
.formula{background:var(--pri-soft);color:var(--pri);border-radius:10px;padding:9px 11px;font-weight:600;font-size:14.5px;margin:10px 0}
.ex{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex .en{font-weight:600}
.lesson{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.lesson:last-child{border-bottom:0}
.num{width:30px;height:30px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:0 0 30px}
.num.done{background:var(--ok);color:#fff}
.back{color:var(--pri);font-weight:600;padding:6px 0}
.fb{border-radius:10px;padding:9px 11px;margin-top:6px;font-size:14.5px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.stat{display:flex;gap:8px}
.stat div{flex:1;background:var(--chip);border-radius:12px;padding:9px 10px}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--mute)}
.sync{font-size:11.5px;color:var(--mute);text-align:center;margin-top:14px}
.hidden{display:none!important}
.mic.on{background:var(--bad-soft);color:var(--bad)}
</style>
</head>

n later.","o":["must","might","can't"],"a":1}]},{"t":"Wish / if only","d":"Şimdiki durumdan pişmanlık: wish + Past Simple. Geçmişten pişmanlık: wish + Past Perfect. Başkasının davranışından şikâyet: wish + would.","f":"I wish I had... · I wish I had done... · I wish you would...","x":[["I wish I spoke French.","Keşke Fransızca konuşabilsem."],["I wish I hadn't said that.","Keşke bunu söylemeseydim."],["I wish you would stop.","Keşke dursan."]],"q":[{"q":"I wish I ___ more time.","o":["have","had","will have"],"a":1},{"q":"I wish I ___ to the party last week.","o":["went","had gone","go"],"a":1}]},{"t":"Future Continuous & Future Perfect","d":"Future Continuous: gelecekte belli bir anda sürüyor olacak eylem. Future Perfect: gelecekte belli bir zamana kadar bitmiş olacak eylem.","f":"will be + V-ing · will have + V3","x":[["This time tomorrow I'll be flying to London.","Yarın bu saatte Londra'ya uçuyor olacağım."],["By 2030 I will have paid off my loan.","2030'a kadar kredimi ödemiş olacağım."]],"q":[{"q":"By Friday, I ___ the report.","o":["will finish","will have finished","finish"],"a":1},{"q":"Don't call at 9; I ___ dinner.","o":["will be having","have had","had"],"a":0}]},{"t":"Bağlaçlar: although, despite, however","d":"Zıtlık bildirir. although + cümle, despite/in spite of + isim veya V-ing, however cümleler arasında.","f":"Although it rained, ... · Despite the rain, ... · However, ...","x":[["Although he was ill, he went to work.","Hasta olmasına rağmen işe gitti."],["Despite the traffic, we arrived on time.","Trafiğe rağmen zamanında vardık."],["It was expensive. However, it was worth it.","Pahalıydı. Ancak değerdi."]],"q":[{"q":"___ being tired, she kept working.","o":["Although","Despite","However"],"a":1},{"q":"___ it was cold, we went swimming.","o":["Despite","Although","In spite"],"a":1}]},{"t":"Phrasal verbs","d":"Fiil + edat birleşimi; anlam çoğu zaman tamamen değişir. Günlük konuşmada çok yaygındır.","f":"give up · look after · find out · put off","x":[["I gave up smoking.","Sigarayı bıraktım."],["Can you look after my cat?","Kedime bakabilir misin?"],["We put off the meeting.","Toplantıyı erteledik."]],"q":[{"q":"I need to ___ what time the train leaves.","o":["find out","give up","put off"],"a":0},{"q":"Don't ___! You can do it.","o":["look after","give up","take off"],"a":1}]}],"C1":[{"t":"Inversion (devrik yapı)","d":"Vurgu için olumsuz zarf başa alınır ve yardımcı fiil özneden önce gelir. Resmî ve yazılı dilde yaygındır.","f":"Never/Rarely/Not only + yardımcı fiil + özne","x":[["Never have I seen such a mess.","Hiç böyle bir dağınıklık görmedim."],["Not only did he lie, but he also stole.","Sadece yalan söylemedi, aynı zamanda çaldı da."],["Rarely do we get such chances.","Böyle fırsatları nadiren yakalarız."]],"q":[{"q":"Not until later ___ the truth.","o":["I realised","did I realise","I did realise"],"a":1},{"q":"Hardly ___ arrived when it started.","o":["had we","we had","we have"],"a":0}]},{"t":"Mixed conditionals","d":"Geçmişteki koşulun şimdiki sonucu veya şimdiki durumun geçmişteki sonucu.","f":"If + had V3, would + V (şimdi) · If + Past Simple, would have V3","x":[["If I had taken that job, I would be rich now.","O işi alsaydım şimdi zengin olurdum."],["If I weren't so shy, I would have spoken to her.","Bu kadar utangaç olmasam onunla konuşurdum."]],"q":[{"q":"If she had studied medicine, she ___ a doctor now.","o":["would have been","would be","will be"],"a":1},{"q":"If he ___ lazy, he would have finished.","o":["weren't","hadn't","isn't"],"a":0}]},{"t":"Cleft sentences","d":"Cümlenin bir kısmını vurgulamak için It is/was ... that veya What ... is yapısı.","f":"It was X that... · What I need is...","x":[["It was Ali who broke the window.","Camı kıran Ali'ydi."],["What I need is a holiday.","İhtiyacım olan şey bir tatil."],["It's the price that worries me.","Beni endişelendiren fiyat."]],"q":[{"q":"___ I really want is some peace.","o":["That","What","It"],"a":1},{"q":"It was in 2010 ___ we met.","o":["that","what","which"],"a":0}]},{"t":"Participle clauses","d":"Yan cümleleri kısaltmak için -ing veya V3 ile başlayan yapılar. Yazıda akıcılık sağlar.","f":"V-ing ..., · Having V3 ..., · V3 ...,","x":[["Walking home, I met an old friend.","Eve yürürken eski bir arkadaşla karşılaştım."],["Having finished the work, she left.","İşi bitirdikten sonra çıktı."],["Built in 1890, the house needs repairs.","1890'da yapılan ev tamir gerektiriyor."]],"q":[{"q":"___ the email, he called me.","o":["Having read","Read","Reads"],"a":0},{"q":"___ by millions, the song became a hit.","o":["Loving","Loved","Love"],"a":1}]},{"t":"Advanced passives","d":"Söylenti ve genel görüşler için: It is said that... / He is believed to... Ayrıca have/get something done (bir işi başkasına yaptırmak).","f":"It is said that... · X is thought to + V · have sth done","x":[["It is said that he is very rich.","Çok zengin olduğu söyleniyor."],["She is believed to be in Paris.","Paris'te olduğuna inanılıyor."],["I had my car repaired.","Arabamı tamir ettirdim."]],"q":[{"q":"He is thought ___ the country.","o":["to have left","leaving","left"],"a":0},{"q":"I need to get my hair ___.","o":["cut","cutting","to cut"],"a":0}]},{"t":"Hedging (ihtiyatlı dil)","d":"İş ve akademik dilde kesinlikten kaçınmak: seem, appear, tend to, it could be argued, likely.","f":"It seems that... · tend to · is likely to","x":[["The results seem to suggest a link.","Sonuçlar bir bağlantıya işaret ediyor gibi."],["Prices are likely to rise.","Fiyatların artması muhtemel."],["It could be argued that...","...olduğu öne sürülebilir."]],"q":[{"q":"People ___ to spend more in December.","o":["tend","seem that","likely"],"a":0},{"q":"The project is ___ to be delayed.","o":["likely","seems","tends"],"a":0}]},{"t":"Emphasis: do/does/did, such / so","d":"Olumlu cümlede vurgu için do/does/did + yalın fiil. so + sıfat, such + (a) sıfat + isim.","f":"I do like it! · so good · such a good idea","x":[["I did tell you!","Sana söyledim ama!"],["It was such a long day.","O kadar uzun bir gündü ki."],["She's so talented.","O çok yetenekli."]],"q":[{"q":"It was ___ a nice surprise.","o":["so","such","very"],"a":1},{"q":"I ___ want to help, really.","o":["do","am","does"],"a":0}]},{"t":"Kalıp ifadeler ve collocations","d":"Kelimelerin doğal olarak birlikte kullanıldığı kalıplar. C1'de doğal konuşmanın anahtarıdır.","f":"make a decision · take into account · bear in mind · draw a conclusion","x":[["We need to take costs into account.","Maliyetleri hesaba katmalıyız."],["Bear in mind that it's a holiday.","Tatil olduğunu aklında tut."],["It's hard to draw a conclusion.","Sonuç çıkarmak zor."]],"q":[{"q":"We have to ___ a decision today.","o":["do","make","take"],"a":1},{"q":"Please ___ in mind the deadline.","o":["keep","bear","hold"],"a":1}]}],"C2":[{"t":"Subjunctive","d":"Resmî talep, öneri ve zorunluluk bildiren ifadelerden sonra fiil yalın hâlde kalır (he go, she be).","f":"suggest/insist/demand + that + özne + yalın fiil","x":[["I suggest that he see a doctor.","Doktora görünmesini öneririm."],["It is essential that she be informed.","Onun bilgilendirilmesi şart."],["They insisted that we stay.","Kalmamızda ısrar ettiler."]],"q":[{"q":"The board demanded that he ___.","o":["resigns","resign","resigned"],"a":1},{"q":"It is vital that everyone ___ on time.","o":["be","is","will be"],"a":0}]},{"t":"Ellipsis ve substitution","d":"Tekrardan kaçınmak için kelimeleri atlama (ellipsis) veya so/do/one ile yerine koyma.","f":"I think so. · So do I. · Neither have I. · the red one","x":[["'Is it ready?' — 'I hope so.'","Umarım öyledir."],["She can swim and so can I.","O yüzebiliyor, ben de."],["I wanted to go but I couldn't.","Gitmek istedim ama gidemedim."]],"q":[{"q":"'I haven't seen it.' — '___.'","o":["Neither have I","So have I","Neither I have"],"a":0},{"q":"'Will it rain?' — 'I'm afraid ___.'","o":["it","so","yes"],"a":1}]},{"t":"Nuanced modality","d":"Modal fiillerle ince anlam farkları: needn't have (gereksiz yere yaptın), was to have (planlanmış ama olmamış), might as well (yapsan da olur).","f":"needn't have V3 · was to have V3 · might as well + V","x":[["You needn't have brought a gift.","Hediye getirmene gerek yoktu."],["He was to have arrived yesterday.","Dün gelmesi gerekiyordu (gelmedi)."],["We might as well go home.","Eve gitsek iyi olur."]],"q":[{"q":"I ___ worried; everything was fine.","o":["needn't have","mustn't have","couldn't"],"a":0},{"q":"The bus is late. We ___ walk.","o":["might as well","must have","needn't"],"a":0}]},{"t":"Nominalisation","d":"Fiil ve sıfatları isme çevirerek daha resmî ve yoğun bir üslup kurmak. Rapor ve akademik dilde kullanılır.","f":"decide→decision · fail→failure · analyse→analysis","x":[["The decision to close the plant was criticised.","Fabrikayı kapatma kararı eleştirildi."],["The failure of the project led to job losses.","Projenin başarısızlığı iş kayıplarına yol açtı."]],"q":[{"q":"Formal: 'They ___ the data carefully.' → 'A careful ___ of the data...'","o":["analysis","analyse","analytic"],"a":0},{"q":"'He arrived late' → 'His late ___'","o":["arrive","arrival","arriving"],"a":1}]},{"t":"Fronting","d":"Vurgu veya üslup için normalde sonda olan öğeyi başa almak.","f":"Nesne/sıfat/zarf öbeği + özne + fiil","x":[["Strange as it may seem, I enjoyed it.","Garip görünse de keyif aldım."],["That I can't accept.","Onu kabul edemem."],["Down came the rain.","Ve yağmur bastırdı."]],"q":[{"q":"___ as it was, the plan worked.","o":["Risky","Riskily","Risk"],"a":0},{"q":"Much ___ I tried, I couldn't do it.","o":["as","so","though"],"a":0}]},{"t":"Idioms (deyimler)","d":"Anlamı kelimelerden çıkarılamayan kalıplar. Anadil konuşanlar sık kullanır.","f":"break the ice · a piece of cake · hit the nail on the head","x":[["The exam was a piece of cake.","Sınav çocuk oyuncağıydı."],["He hit the nail on the head.","Tam üstüne bastı."],["A joke can break the ice.","Bir şaka buzları eritebilir."]],"q":[{"q":"'Once in a blue moon' ne demek?","o":["Çok nadiren","Her gece","Ayda bir kez"],"a":0},{"q":"'Cost an arm and a leg' ne demek?","o":["Çok pahalı olmak","Yaralanmak","Ucuz olmak"],"a":0}]},{"t":"Register (üslup düzeyi)","d":"Aynı anlamı resmî ve gündelik üslupta farklı ifade etmek. C2 seviyesinde ortama uygun dili seçmek beklenir.","f":"get → obtain · ask for → request · find out → ascertain","x":[["Informal: Can you help me out?","Bana yardım eder misin?"],["Formal: I would be grateful for your assistance.","Yardımınız için minnettar olurum."],["We need to find out → We need to ascertain","Öğrenmemiz gerek → Tespit etmemiz gerek"]],"q":[{"q":"Formal karşılığı 'buy':","o":["purchase","grab","pick up"],"a":0},{"q":"Formal karşılığı 'start':","o":["kick off","commence","get going"],"a":1}]},{"t":"Discourse markers","d":"Konuşma ve yazıda düşünceleri bağlayan ifadeler: nonetheless, notwithstanding, by the same token, as it were.","f":"Nonetheless, ... · By the same token, ... · Admittedly, ...","x":[["The plan is risky. Nonetheless, we'll try.","Plan riskli. Yine de deneyeceğiz."],["Admittedly, I was wrong.","Kabul etmek gerekir ki haksızdım."],["By the same token, prices may fall.","Aynı mantıkla fiyatlar düşebilir."]],"q":[{"q":"It was hard; ___, we succeeded.","o":["nonetheless","because","therefore"],"a":0},{"q":"___, I made a mistake, but...","o":["Admittedly","Hence","Whereas"],"a":0}]}]}</script>
<script>
(function(){
const V = JSON.parse(document.getElementById('vocab').textContent);
const G = JSON.parse(document.getElementById('grammar').textContent);
const LEVELS = ['A1','A2','B1','B2','C1','C2'];
const LVNAME = {A1:'Başlangıç',A2:'Temel',B1:'Orta',B2:'Orta üstü',C1:'İleri',C2:'Uzman'};
const POS = {n:'isim',v:'fiil',j:'sıfat',r:'zarf',x:'diğer'};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const ICON = {
  spk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  gram:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 8h6M9 12h4"/></svg>',
  dict:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>',
  card:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 6V4h14v14h-4"/></svg>',
  verb:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h4M10 7h4M16 7h4M4 12h4M10 12h4M16 12h4M4 17h4M10 17h4M16 17h4"/></svg>',
  test:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 11l2.5 2.5L16 9"/><rect x="3" y="3" width="18" height="18" rx="3"/></svg>'
};

/* ---------- progress state ---------- */
const LS_KEY = 'eng-a1c2-progress-v1';
let P = {known:{}, gram:{}, best:{}};
try { const s = localStorage.getItem(LS_KEY); if (s) P = Object.assign(P, JSON.parse(s)); } catch(e){}
const knownSet = {};
LEVELS.forEach(L => knownSet[L] = new Set((P.known && P.known[L]) || []));
function snapshot(){
  const known = {}; LEVELS.forEach(L => known[L] = [...knownSet[L]]);
  return {known, gram:P.gram||{}, best:P.best||{}, v:1};
}
let remote = null, saveTimer = null, saving = false, dirty = false;
function save(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(snapshot())); } catch(e){}
  if (!remote) return;
  dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 1500);
}
async function flush(){
  if (!remote || saving || !dirty) return;
  saving = true; dirty = false;
  try { await remote.set(snapshot()); setSync('Hesabına kaydedildi · tüm cihazlarında aynı ilerleme'); }
  catch(e){ setSync('Bu cihaza kaydediliyor'); if (e && e.code === 'invalid_argument') remote = null; }
  saving = false; if (dirty) flush();
}
function setSync(t){ $('#sync').textContent = t; }
setSync('Çevrimdışı sürüm · ilerlemen bu telefona kaydediliyor');

/* ---------- speech ---------- */
let ctts = null, dict = null;
const synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;
let enVoice = null;
function pickVoice(){ if(!synth) return; const vs = synth.getVoices(); enVoice = vs.find(v=>/en[-_]US/i.test(v.lang) && /Samantha|Alex|Google|Ava|Allison/i.test(v.name)) || vs.find(v=>/^en[-_]US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null; }
if (synth){ pickVoice(); synth.onvoiceschanged = pickVoice; }
function canSpeak(){ return !!(ctts || synth); }
function speak(text){
  if (ctts){ ctts.speak(text, {language:'en', rate:0.9}).catch(()=>webSpeak(text)); return; }
  webSpeak(text);
}
function webSpeak(text){
  if (!synth) return;
  try { synth.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.9; if (enVoice) u.voice=enVoice; synth.speak(u); } catch(e){}
}
function refreshTTS(){ document.body.classList.toggle('no-tts', !canSpeak()); }
refreshTTS();
document.addEventListener('click', e => {
  const b = e.target.closest('[data-say]'); if (!b) return;
  e.stopPropagation(); speak(b.getAttribute('data-say'));
}, true);
const IRR = {hide:'hid',bite:'bit',steal:'stole',flee:'fled',deny:'deni',defy:'defi',bury:'buri',wane:'wan',be:'is|are|was|were|been',have:'has|had',do:'does|did',go:'went|gone',buy:'bought',eat:'ate',see:'saw|seen',take:'took',give:'gave',come:'came',get:'got',make:'made',run:'ran',sit:'sat',win:'won'};
const FORMS = {};
LEVELS.forEach(L => V[L].forEach(e => { if (e[7]) FORMS[e[0].toLowerCase()] = (e[7][0]+'/'+e[7][1]).split(/[\/ ]/).filter(x=>x && x.length>1).join('|'); }));
function hl(sent, word){
  const w = word.toLowerCase(); let pat;
  const escR = x => x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  if (/\s|-/.test(w)) pat = escR(w);
  else { const stem = w.length>4 ? w.slice(0, Math.max(3, w.length-3)) : w; pat = escR(stem)+'[a-z]*' + (IRR[w] ? '|'+IRR[w]+'[a-z]*' : '') + (FORMS[w] ? '|'+FORMS[w] : ''); }
  let re; try { re = new RegExp('\\b('+pat+')', 'i'); } catch(e){ return esc(sent); }
  const m = sent.match(re);
  if (!m) return esc(sent);
  return esc(sent.slice(0,m.index)) + '<mark>' + esc(m[0]) + '</mark>' + esc(sent.slice(m.index+m[0].length));
}
function synBlock(e, center){
  if (e[6] && e[6].length){
    return `<div class="lab">Eş / yakın anlamlılar ve kullanımı</div><div class="sent" style="padding:2px 12px">${e[6].map(([w,n,se,tr])=>`<div class="syn"><div class="row" style="align-items:flex-start"><div class="grow"><span class="sw">${esc(w)}</span><div class="note">${esc(n)}</div><div class="se">${hl(se,w)}</div>${tr?`<div class="muted small">${esc(tr)}</div>`:''}</div>${spk(se)}</div></div>`).join('')}</div>`;
  }
  if (!e[3].length) return '';
  return `<div class="lab">Eş / yakın anlamlılar</div><div class="chips"${center?' style="justify-content:center"':''}>${e[3].map(s=>`<button class="chip" data-say="${esc(s)}">${esc(s)}</button>`).join('')}</div>`;
}
function formsBlock(e){
  const f = e[7]; if (!f) return '';
  return `<div class="vforms"><div><small>V1</small><b>${esc(e[0])}</b></div><div><small>V2 · past</small><b class="${f[2]?'irr':''}">${esc(f[0])}</b></div><div><small>V3 · participle</small><b class="${f[2]?'irr':''}">${esc(f[1])}</b></div></div>${f[3]?`<div class="muted small">${esc(f[3])}</div>`:''}`;
}
function sentBlock(e){
  if (!e[4]) return '';
  return `<div class="sent"><div class="row" style="align-items:flex-start"><div class="grow"><div class="en">${hl(e[4],e[0])}</div>${e[5]?`<div class="muted small" style="margin-top:3px">${esc(e[5])}</div>`:''}</div>${spk(e[4])}</div></div>`;
}
const spk = t => `<button class="spk" data-say="${esc(t)}" aria-label="Dinle">${ICON.spk}</button>`;

/* ---------- capabilities (optional) ---------- */
(async function(){
  if (!window.claude || !window.claude.use) return;
  try { const t = await window.claude.use('tts'); if (t){ ctts = t; refreshTTS(); } } catch(e){}
  try { const d = await window.claude.use('dictation'); if (d){ dict = d;
    d.onFinal(({text}) => { if (deck){ deck.heard = text; render(); } try{ d.stop(); }catch(e){} });
    d.onState(({state:s}) => { const b=document.querySelector('.mic'); if (b) b.classList.toggle('on', s==='listening'); });
    if (state.tab==='cards') render(); } } catch(e){}
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.doc('data/users/' + id + '/progress');
    const snap = await ref.get();
    if (snap.exists){
      const r = snap.data() || {};
      LEVELS.forEach(L => ((r.known||{})[L]||[]).forEach(w => knownSet[L].add(w)));
      P.gram = Object.assign({}, r.gram||{}, P.gram||{});
      const best = Object.assign({}, r.best||{});
      Object.keys(P.best||{}).forEach(k => best[k] = Math.max(best[k]||0, P.best[k]));
      P.best = best;
    }
    remote = ref; save(); render(); setSync('Hesabına kaydediliyor · tüm cihazlarında aynı ilerleme');
  } catch(e){}
})();

/* ---------- app state ---------- */
let state = {lv:'A1', tab:'dict', q:'', filter:'all', all:false, limit:60, open:null, lesson:null};
try { const s = JSON.parse(localStorage.getItem('eng-a1c2-ui')||'{}'); if (LEVELS.includes(s.lv)) state.lv=s.lv; if (s.tab) state.tab=s.tab; } catch(e){}
function saveUI(){ try{ localStorage.setItem('eng-a1c2-ui', JSON.stringify({lv:state.lv,tab:state.tab})); }catch(e){} }

function renderLevels(){
  $('#levels').innerHTML = LEVELS.map(L => {
    const pct = Math.round(100*knownSet[L].size/V[L].length);
    return `<button class="lv ${L===state.lv?'on':''}" style="--c:var(--${L})" data-lv="${L}"><b>${L}</b><small>${LVNAME[L]} · ${V[L].length}</small><div class="bar"><i style="width:${pct}%"></i></div></button>`;
  }).join('');
}
$('#levels').addEventListener('click', e => {
  const b = e.target.closest('[data-lv]'); if (!b) return;
  state.lv = b.dataset.lv; vquiz=null; state.limit=60; state.open=null; state.lesson=null; deck=null; quiz=null; saveUI(); render();
});
const TABS = [['gram','Gramer'],['dict','Sözlük'],['verbs','Fiiller'],['cards','Kartlar'],['test','Test']];
function renderTabs(){
  $('#tabs').innerHTML = TABS.map(([k,n]) => `<button class="${state.tab===k?'on':''}" data-tab="${k}">${ICON[{gram:'gram',dict:'dict',verbs:'verb',cards:'card',test:'test'}[k]]}${n}</button>`).join('');
}
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  state.tab = b.dataset.tab; state.lesson=null; saveUI(); render(); window.scrollTo(0,0);
});

function render(){
  renderLevels(); renderTabs();
  const v = $('#view');
  if (state.tab==='gram') v.innerHTML = state.lesson===null ? gramList() : gramLesson();
  else if (state.tab==='dict') v.innerHTML = dictView();
  else if (state.tab==='verbs') v.innerHTML = verbsView();
  else if (state.tab==='cards') v.innerHTML = cardsView();
  else v.innerHTML = testView();
}

/* ---------- grammar ---------- */

  const L = state.lv, ls = G[L] || [];
  const done = ls.filter((_,i)=>P.gram[L+':'+i]).length;
  return `<div class="card"><div class="row"><div class="grow"><b>${L} gramer dersleri</b><div class="muted small">${done}/${ls.length} ders tamamlandı · her ders 2-3 dakika</div></div></div>
  <div class="prog"><i style="width:${100*done/ls.length}%"></i></div></div>
  <div class="card">${ls.map((g,i)=>`<button class="lesson" data-lesson="${i}"><span class="num ${P.gram[L+':'+i]?'done':''}">${P.gram[L+':'+i]?'✓':i+1}</span><span class="grow"><b>${esc(g.t)}</b><br><span class="muted small">${esc(g.f)}</span></span><span class="muted">›</span></button>`).join('')}</div>`;
}
let gq = {};
function gramLesson(){
  const L = state.lv, i = state.lesson, g = G[L][i];
  return `<button class="back" data-act="gback">‹ Dersler</button>
  <div class="card"><span class="pill">${L} · Ders ${i+1}</span><h2 style="margin:8px 0 6px;font-size:21px">${esc(g.t)}</h2>
  <p style="margin:0">${esc(g.d)}</p><div class="formula">${esc(g.f)}</div>
  <div class="lab">Örnekler</div>
  ${g.x.map(([en,tr])=>`<div class="ex">${spk(en)}<div class="grow"><div class="en">${esc(en)}</div><div class="muted small">${esc(tr)}</div></div></div>`).join('')}
  </div>
  <div class="card"><div class="lab" style="margin-top:0">Mini test</div>
  ${g.q.map((q,qi)=>{ const a = gq[qi];
    return `<div class="q" style="font-size:17px">${qi+1}. ${esc(q.q)}</div>${q.o.map((o,oi)=>{
      let c=''; if (a!==undefined){ if (oi===q.a) c='right'; else if (oi===a) c='wrong'; }
      return `<button class="opt ${c}" data-gq="${qi}" data-o="${oi}" ${a!==undefined?'disabled':''}>${esc(o)}</button>`; }).join('')}`;
  }).join('')}
  ${Object.keys(gq).length===g.q.length ? `<div class="fb ${g.q.every((q,qi)=>gq[qi]===q.a)?'ok':'bad'}">${g.q.every((q,qi)=>gq[qi]===q.a)?'Harika! Ders tamamlandı.':'Doğru cevaplar yeşil. Tekrar denemek için dersi yeniden aç.'}</div>`:''}
  </div>
  <div class="btns">${i>0?`<button class="btn ghost" data-lesson="${i-1}">‹ Önceki</button>`:''}${i<G[L].length-1?`<button class="btn" data-lesson="${i+1}">Sonraki ders ›</button>`:''}</div>`;
}

/* ---------- dictionary ---------- */
function norm(s){ return s.toLocaleLowerCase('tr').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ı/g,'i'); }
function dictItems(){
  const q = norm(state.q.trim());
  const lvls = (state.all && q) ? LEVELS : [state.lv];
  let out = [];
  lvls.forEach(L => V[L].forEach((e,idx) => {
    if (state.filter==='todo' && knownSet[L].has(e[0])) return;
    if (state.filter==='known' && !knownSet[L].has(e[0])) return;
    if (q){ const hay = norm(e[0]+' | '+e[2]+' | '+e[3].join(' ')); if (!hay.includes(q)) return; }
    out.push([L,idx]);
  }));
  if (q) out.sort((a,b)=>{ const wa=norm(V[a[0]][a[1]][0]), wb=norm(V[b[0]][b[1]][0]); return (wb.startsWith(q)-wa.startsWith(q)) || (wa.length-wb.length); });
  return out;
}
function dictView(){
  const L = state.lv, k = knownSet[L].size, tot = V[L].length;
  return `<div class="card">
    <div class="stat"><div><b>${tot}</b><span>${L} kelime</span></div><div><b>${k}</b><span>öğrendiğin</span></div><div><b>${tot-k}</b><span>kalan</span></div></div>
    <div style="height:10px"></div>
    <input id="q" class="search" type="search" placeholder="İngilizce veya Türkçe ara…" value="${esc(state.q)}" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div style="height:8px"></div>
    <div class="seg" id="flt">${[['all','Tümü'],['todo','Öğrenilecek'],['known','Öğrendiklerim']].map(([k,n])=>`<button data-f="${k}" class="${state.filter===k?'on':''}">${n}</button>`).join('')}</div>
    <label class="row small muted" style="margin-top:8px"><input type="checkbox" id="allLv" ${state.all?'checked':''}> Aramada tüm seviyelere bak</label>
  </div>
  <div id="dres">${dictResults()}</div>`;
}
function dictResults(){
  const items = dictItems(), shown = items.slice(0, state.limit);
  return `<div class="card" style="padding:4px 12px">
    ${shown.length ? shown.map(([LL,i]) => wordRow(LL,i)).join('') : '<p class="muted" style="padding:10px 0">Sonuç yok.</p>'}
  </div>
  ${items.length>state.limit ? `<button class="btn ghost" style="width:100%" data-act="more">Daha fazla göster (${items.length-state.limit} kaldı)</button>`:''}`;
}
function wordRow(L,i){
  const e = V[L][i], id = L+':'+i, open = state.open===id, kn = knownSet[L].has(e[0]);
  return `<div class="word ${open?'open':''}" data-w="${id}">
    <div class="row"><span class="known-dot ${kn?'k':''}"></span><div class="grow"><span class="w">${esc(e[0])}</span> <span class="pill">${POS[e[1]]||''}</span>${(state.all&&state.q)?` <span class="pill">${L}</span>`:''}<div class="t">${esc(e[2])}</div>${(!open && e[4])?`<div class="ex1">${hl(e[4],e[0])}</div>`:''}</div>${spk(e[0])}</div>
    ${open ? `<div class="det">${formsBlock(e)}${sentBlock(e)}
      ${synBlock(e)}
      <button class="btn ${kn?'ghost':'ok'}" style="width:100%;margin-top:6px" data-known="${id}">${kn?'Öğrendiklerimden çıkar':'Öğrendim ✓'}</button>
    </div>`:''}
  </div>`;
}

/* ---------- verbs (V1/V2/V3) ---------- */
let vstate = {q:'', f:'all', all:false, limit:80};
let vquiz = null;
function verbItems(){
  const q = norm(vstate.q.trim());
  const lv = vstate.all ? LEVELS : [state.lv];
  const out = [];
  lv.forEach(L => V[L].forEach((e,i) => {
    const f = e[7]; if (!f) return;
    if (vstate.f==='irr' && !f[2]) return;
    if (vstate.f==='reg' && f[2]) return;
    if (q && !norm(e[0]+' '+f[0]+' '+f[1]+' '+e[2]).includes(q)) return;
    out.push([L,i]);
  }));
  return out;
}
function verbRows(){
  const items = verbItems(), shown = items.slice(0, vstate.limit);
  return `<div class="card" style="padding:4px 12px">${shown.length ? shown.map(([L,i])=>{ const e=V[L][i], f=e[7];
    return `<div class="vrow"><div class="c"><small>V1</small><b>${esc(e[0])}</b>${f[2]?'<span class="badge">düzensiz</span>':''}</div><div class="c"><small>V2</small><b class="${f[2]?'irr':''}">${esc(f[0])}</b></div><div class="c"><small>V3</small><b class="${f[2]?'irr':''}">${esc(f[1])}</b></div>${spk(e[0]+', '+f[0].replace(/\//g,' or ')+', '+f[1].replace(/\//g,' or '))}<div class="tr">${esc(e[2])}${vstate.all?` · ${L}`:''}${f[3]?`<br><i>${esc(f[3])}</i>`:''}</div></div>`; }).join('') : '<p class="muted" style="padding:10px 0">Sonuç yok.</p>'}</div>
  ${items.length>vstate.limit ? `<button class="btn ghost" style="width:100%" data-act="vmore">Daha fazla göster (${items.length-vstate.limit} kaldı)</button>`:''}`;
}
function makeVQuiz(){
  const L = state.lv;
  let pool = []; V[L].forEach((e,i)=>{ if (e[7] && (vstate.f!=='reg' ? e[7][2] : true)) pool.push(i); });
  if (pool.length < 4){ pool = []; V[L].forEach((e,i)=>{ if (e[7]) pool.push(i); }); }
  const allForms = []; LEVELS.forEach(LL => V[LL].forEach(e => { if (e[7]) allForms.push(e[7][0], e[7][1]); }));
  const qs = shuffle(pool).slice(0,10).map(i => {
    const e = V[L][i], f = e[7], which = Math.random()<.5 ? 0 : 1;
    const ans = f[which];
    const head = e[0].split(' ')[0];
    const cands = [f[1-which], head+'ed', head.replace(/e$/,'')+'ed', ...shuffle(allForms)];
    const opts = []; const parts = ans.split('/'); cands.forEach(c => { if (c && c!==ans && !parts.includes(c) && !c.split('/').some(x=>parts.includes(x)) && !opts.includes(c) && opts.length<3) opts.push(c); });
    return {i, which, ans, opts: shuffle([ans, ...opts]), pick:null};
  });
  vquiz = {L, qs, pos:0, score:0};
}
function verbsView(){
  const L = state.lv;
  if (vquiz && vquiz.L===L){
    if (vquiz.pos >= vquiz.qs.length){
      const wrong = vquiz.qs.filter(q=>q.pick!==q.ans);
      return `<div class="card" style="text-align:center"><div style="font-size:40px;font-weight:800">${vquiz.score}/${vquiz.qs.length}</div><p class="muted">Fiil halleri testi</p><div class="btns"><button class="btn ghost" data-act="vqexit">Listeye dön</button><button class="btn" data-act="vqstart">Yeni test</button></div></div>
      ${wrong.length?`<div class="card"><div class="lab" style="margin-top:0">Tekrar et</div>${wrong.map(q=>{const e=V[L][q.i];return `<div class="vrow"><div class="c"><b>${esc(e[0])}</b></div><div class="c"><b class="irr">${esc(e[7][0])}</b></div><div class="c"><b class="irr">${esc(e[7][1])}</b></div>${spk(e[0]+', '+e[7][0]+', '+e[7][1])}<div class="tr">${esc(e[2])}</div></div>`;}).join('')}</div>`:''}`;
    }
    const q = vquiz.qs[vquiz.pos], e = V[L][q.i];
    return `<div class="small muted">Soru ${vquiz.pos+1}/${vquiz.qs.length} · Skor ${vquiz.score}</div><div class="prog"><i style="width:${100*vquiz.pos/vquiz.qs.length}%"></i></div>
    <div class="card"><div class="muted small">${esc(e[2])}</div><div class="q">${esc(e[0])} → ${q.which===0?'V2 (geçmiş zaman)':'V3 (past participle)'} ?</div>
    ${q.opts.map((o,oi)=>{let c=''; if(q.pick!==null){ if(o===q.ans)c='right'; else if(o===q.pick)c='wrong'; } return `<button class="opt ${c}" data-vqo="${oi}" ${q.pick!==null?'disabled':''}>${esc(o)}</button>`;}).join('')}
    ${q.pick!==null?`<div class="fb ${q.pick===q.ans?'ok':'bad'}"><b>${esc(e[0])} – ${esc(e[7][0])} – ${esc(e[7][1])}</b>${e[7][3]?`<br>${esc(e[7][3])}`:''}</div><button class="btn" style="width:100%;margin-top:10px" data-act="vqnext">${vquiz.pos<vquiz.qs.length-1?'Sonraki ›':'Sonucu gör'}</button>`:''}</div>`;
  }
  const verbs = V[L].filter(e=>e[7]), irr = verbs.filter(e=>e[7][2]).length;
  return `<div class="card">
    <div class="stat"><div><b>${verbs.length}</b><span>${L} fiil</span></div><div><b>${irr}</b><span>düzensiz</span></div><div><b>${verbs.length-irr}</b><span>düzenli (-ed)</span></div></div>
    <p class="small muted" style="margin:10px 0 8px">V1 = yalın hâl · V2 = geçmiş zaman (Past Simple) · V3 = Present Perfect ve edilgen yapıda kullanılan hâl. Turuncu olanlar düzensiz, ezberlenmesi gerekenler.</p>
    <input id="vq" class="search" type="search" placeholder="Fiil ara (go, went, gitmek…)" value="${esc(vstate.q)}" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div style="height:8px"></div>
    <div class="seg">${[['all','Tümü'],['irr','Düzensiz'],['reg','Düzenli']].map(([k,n])=>`<button data-vf="${k}" class="${vstate.f===k?'on':''}">${n}</button>`).join('')}</div>
    <label class="row small muted" style="margin-top:8px"><input type="checkbox" id="vAll" ${vstate.all?'checked':''}> Tüm seviyelerin fiillerini göster</label>
    <button class="btn" style="width:100%;margin-top:10px" data-act="vqstart">V2 / V3 testi (10 soru)</button>
  </div>
  <div id="vres">${verbRows()}</div>`;
}

/* ---------- flashcards ---------- */
let deck = null;
function newDeck(){
  const L = state.lv;
  const idx = V[L].map((_,i)=>i).filter(i=>!knownSet[L].has(V[L][i][0]));
  deck = {L, list: shuffle(idx), pos:0, flip:false, dir: deck?deck.dir:'en', seen:0, knew:0, heard:''};
}
function cardsView(){
  if (!deck || deck.L!==state.lv) newDeck();
  const L = state.lv;
  if (!deck.list.length) return `<div class="card fc"><div class="big">🎉</div><p>${L} seviyesindeki tüm kelimeleri öğrendin!</p><button class="btn" data-act="restart-all">Hepsini yeniden çalış</button></div>`;
  if (deck.pos>=deck.list.length) return `<div class="card fc"><div class="big">Tur bitti</div><p class="muted">${deck.seen} kart · ${deck.knew} tanesini bildin</p><button class="btn" data-act="newdeck">Yeni tur başlat</button></div>`;
  const e = V[L][deck.list[deck.pos]];
  const front = deck.dir==='en' ? `<div class="big">${esc(e[0])}</div><div class="pill" style="margin-top:6px">${POS[e[1]]||''}</div>` : `<div class="big" style="font-size:26px">${esc(e[2])}</div>`;
  const back = `<div class="big">${esc(e[0])}</div><div class="tr">${esc(e[2])}</div>${formsBlock(e)}${sentBlock(e)}${synBlock(e,true)}`;
  return `<div class="row" style="margin:2px 2px 0"><div class="grow small muted">${deck.pos+1} / ${deck.list.length} · kalan kelime: ${V[L].length-knownSet[L].size}</div>
    <div class="seg" style="width:150px"><button data-dir="en" class="${deck.dir==='en'?'on':''}">EN→TR</button><button data-dir="tr" class="${deck.dir==='tr'?'on':''}">TR→EN</button></div></div>
  <div class="prog"><i style="width:${100*deck.pos/deck.list.length}%"></i></div>
  <div class="card fc" data-act="flip">${deck.flip?back:front}<p class="muted small" style="margin-top:16px">${deck.flip?'':'Çevirmek için dokun'}</p></div>
  <div class="row" style="justify-content:center;gap:14px;margin:-2px 0 10px">${spk(e[0])}${dict?`<button class="spk mic" data-act="mic" aria-label="Söyle">${ICON.mic}</button>`:''}</div>
  ${deck.heard?`<div class="fb ${norm(deck.heard).includes(norm(e[0]))?'ok':'bad'}" style="text-align:center">Duyulan: “${esc(deck.heard)}” ${norm(deck.heard).includes(norm(e[0]))?'✓':'— tekrar dene'}</div>`:''}
  <div class="btns" style="margin-top:8px"><button class="btn bad" data-act="again">Tekrar sor</button><button class="btn ok" data-act="knew">Biliyorum ✓</button></div>`;
}

/* ---------- test ---------- */
let quiz = null;
function makeQuiz(){
  const L = state.lv, W = V[L];
  const pool = shuffle(W.map((_,i)=>i)).slice(0, 10);
  const withSyn = W.map((e,i)=>i).filter(i=>W[i][3].length>=2);
  const qs = pool.map(i => {
    const e = W[i];
    const types = ['tr','en']; if (e[3].length) types.push('syn','syn');
    const t = types[Math.random()*types.length|0];
    const others = shuffle(W.map((_,j)=>j).filter(j=>j!==i));
    let prompt, answer, opts = [];
    if (t==='tr'){ prompt = `“${e[0]}” ne demek?`; answer = e[2]; opts = others.map(j=>W[j][2]).filter(x=>x!==answer); }
    else if (t==='en'){ prompt = `“${e[2]}” İngilizcesi hangisi?`; answer = e[0]; opts = others.map(j=>W[j][0]); }
    else {
      prompt = `“${e[0]}” kelimesinin eş anlamlısı hangisi?`; answer = e[3][Math.random()*Math.min(3,e[3].length)|0];
      const bad = new Set(e[3].map(s=>s.toLowerCase()).concat([e[0].toLowerCase()]));
      opts = shuffle(withSyn.filter(j=>j!==i)).flatMap(j=>W[j][3]).filter(s=>!bad.has(s.toLowerCase()));
    }
    const uniq = []; opts.forEach(o=>{ if (o!==answer && !uniq.includes(o)) uniq.push(o); });
    return {i, t, prompt, answer, opts: shuffle([answer].concat(uniq.slice(0,3))), pick:null};
  });
  quiz = {L, qs, pos:0, score:0};
}
function testView(){
  const L = state.lv;
  if (!quiz || quiz.L!==L) return `<div class="card"><b>${L} kelime testi</b><p class="muted small" style="margin:6px 0 12px">10 soru: anlam bulma, Türkçeden İngilizceye ve eş anlamlı seçme. En iyi skorun: <b>${P.best[L]!==undefined?P.best[L]+'/10':'—'}</b></p><button class="btn" style="width:100%" data-act="startq">Testi başlat</button></div>`;
  if (quiz.pos>=quiz.qs.length){
    const wrong = quiz.qs.filter(q=>q.pick!==q.answer);
    return `<div class="card" style="text-align:center"><div class="big" style="font-size:40px;font-weight:800">${quiz.score}/10</div><p class="muted">${quiz.score>=8?'Çok iyi!':quiz.score>=5?'İyi gidiyorsun.':'Kartlarla biraz daha çalış.'} · En iyi: ${P.best[L]}/10</p><button class="btn" data-act="startq">Yeni test</button></div>
    ${wrong.length?`<div class="card"><div class="lab" style="margin-top:0">Yanlış yaptıkların</div>${wrong.map(q=>{const e=V[L][q.i];return `<div class="ex">${spk(e[0])}<div class="grow"><div class="en">${esc(e[0])} — <span class="muted">${esc(e[2])}</span></div>${e[3].length?`<div class="small muted">${esc(e[3].join(', '))}</div>`:''}</div></div>`;}).join('')}</div>`:''}`;
  }
  const q = quiz.qs[quiz.pos], e = V[L][q.i];
  return `<div class="small muted">Soru ${quiz.pos+1}/10 · Skor ${quiz.score}</div><div class="prog"><i style="width:${10*quiz.pos}%"></i></div>
  <div class="card"><div class="q">${esc(q.prompt)}</div>
  ${q.opts.map((o,oi)=>{ let c=''; if (q.pick!==null){ if (o===q.answer) c='right'; else if (o===q.pick) c='wrong'; } return `<button class="opt ${c}" data-qo="${oi}" ${q.pick!==null?'disabled':''}>${esc(o)}</button>`; }).join('')}
  ${q.pick!==null?`<div class="fb ${q.pick===q.answer?'ok':'bad'}"><b>${esc(e[0])}</b> = ${esc(e[2])}${e[3].length?`<br>Eş anlamlılar: ${esc(e[3].join(', '))}`:''}${e[4]?`<br><i>${hl(e[4],e[0])}</i>${e[5]?` <span class="muted">— ${esc(e[5])}</span>`:''}`:''}</div><button class="btn" style="width:100%;margin-top:10px" data-act="nextq">${quiz.pos<9?'Sonraki soru ›':'Sonucu gör'}</button>`:''}
  </div>`;
}

/* ---------- events ---------- */
$('#view').addEventListener('input', e => {
  if (e.target.id==='vq'){ vstate.q = e.target.value; vstate.limit=80; $('#vres').innerHTML = verbRows(); return; }
  if (e.target.id==='q'){ state.q = e.target.value; state.limit=60; state.open=null; $('#dres').innerHTML = dictResults(); }
});
$('#view').addEventListener('change', e => { if (e.target.id==='vAll'){ vstate.all = e.target.checked; vstate.limit=80; $('#vres').innerHTML = verbRows(); return; } if (e.target.id==='allLv'){ state.all = e.target.checked; $('#dres').innerHTML = dictResults(); } });
$('#view').addEventListener('click', e => {
  const t = e.target.closest('button,[data-w],[data-act]'); if (!t) return;
  const d = t.dataset;
  if (d.f){ state.filter=d.f; state.limit=60; render(); return; }
  if (d.vf){ vstate.f=d.vf; vstate.limit=80; render(); return; }
  if (d.vqo!==undefined){ const q=vquiz.qs[vquiz.pos]; q.pick=q.opts[+d.vqo]; if (q.pick===q.ans) vquiz.score++; render(); return; }
  if (d.known){ const [L,i]=d.known.split(':'); const w=V[L][+i][0]; knownSet[L].has(w)?knownSet[L].delete(w):knownSet[L].add(w); save(); render(); return; }
  if (d.w && !e.target.closest('button')){ state.open = state.open===d.w?null:d.w; $('#dres').innerHTML = dictResults(); return; }
  if (d.lesson!==undefined){ state.lesson=+d.lesson; gq={}; render(); window.scrollTo(0,0); return; }
  if (d.gq!==undefined){ gq[+d.gq]=+d.o; const g=G[state.lv][state.lesson]; if (Object.keys(gq).length===g.q.length && g.q.every((q,qi)=>gq[qi]===q.a)){ P.gram[state.lv+':'+state.lesson]=1; save(); } render(); return; }
  if (d.dir){ deck.dir=d.dir; deck.flip=false; render(); return; }
  if (d.qo!==undefined){ const q=quiz.qs[quiz.pos]; q.pick=q.opts[+d.qo]; if (q.pick===q.answer) quiz.score++; render(); return; }
  switch(d.act){
    case 'gback': state.lesson=null; render(); break;
    case 'more': state.limit+=80; $('#dres').innerHTML = dictResults(); break;
    case 'flip': deck.flip=!deck.flip; render(); break;
    case 'knew': knownSet[deck.L].add(V[deck.L][deck.list[deck.pos]][0]); deck.knew++; deck.seen++; deck.pos++; deck.flip=false; deck.heard=''; save(); render(); break;
    case 'again': { const c=deck.list[deck.pos]; deck.list.splice(deck.pos,1); deck.list.splice(Math.min(deck.list.length, deck.pos+5),0,c); deck.seen++; deck.flip=false; deck.heard=''; render(); break; }
    case 'newdeck': newDeck(); render(); break;
    case 'restart-all': knownSet[state.lv].clear(); save(); newDeck(); render(); break;
    case 'startq': makeQuiz(); render(); break;
    case 'nextq': quiz.pos++; if (quiz.pos>=quiz.qs.length){ P.best[state.lv]=Math.max(P.best[state.lv]||0, quiz.score); save(); } render(); window.scrollTo(0,0); break;
    case 'mic': startMic(t); break;
    case 'vmore': vstate.limit+=100; $('#vres').innerHTML = verbRows(); break;
    case 'vqstart': makeVQuiz(); render(); window.scrollTo(0,0); break;
    case 'vqnext': vquiz.pos++; render(); break;
    case 'vqexit': vquiz=null; render(); break;
  }
});
function startMic(btn){
  if (!dict) return;
  deck.heard=''; btn.classList.add('on');
  const p = dict.start();
  Promise.resolve(p).catch(err => { btn.classList.remove('on'); if (err && err.code==='not_granted'){ dict=null; render(); } });
}
render();
})();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}</script>
